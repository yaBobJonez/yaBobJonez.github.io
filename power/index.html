<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mikel power status?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="subtitle"></div>
    <div id="title"></div>
    <div id="nextTransition"></div>
    <div id="schedule"></div>
    <div id="updatedDt"></div>

    <script type="module">
        import getPreferredLocale from "./i18n.js"
        const tr = getPreferredLocale();

        document.getElementById("subtitle").innerHTML = tr.subtitle;
        document.getElementById("title").innerHTML = tr.title;
        document.getElementById("nextTransition").innerHTML = tr.nextTransition;
        document.getElementById("updatedDt").innerHTML = tr.updatedDt;

        const {region, dsos, queue} = await fetch("https://api.github.com/gists/4ec4f7b97179cf442396387c4bf2eab4")
            .then(r => r.json())
            .then(c => JSON.parse(c["files"]["power.json"]["content"]));
        const data = await fetch(`https://cors-anywhere.com/https://app.yasno.ua/api/blackout-service/public/shutdowns/regions/${region}/dsos/${dsos}/planned-outages`)
            .then(r => r.json());
        const {today: {slots, status}, updatedOn} = data[queue];

        document.getElementById("updatedDt").innerHTML = tr.lastUpdate(updatedOn);

        function setTheme(isDark) {
            const choose = (array) => array[Math.floor(Math.random() * array.length)];

            document.body.classList.toggle("dark", isDark);
            const subtitle = document.getElementById("subtitle");
            const title = document.getElementById("title");

            if (isDark) {
                subtitle.innerHTML = choose(tr.off.subtitles);
                title.innerHTML = choose(tr.off.titles);
            } else {
                subtitle.innerHTML = choose(tr.on.subtitles);
                title.innerHTML = choose(tr.on.titles);
            }
        }
        
        function addHour(i, power) {
            const grid = document.getElementById("schedule");

            const hourCell = document.createElement("div");
            hourCell.className = "box";
            hourCell.style.gridColumn = i;
            hourCell.style.gridRow = 1;
            hourCell.innerHTML = `${i - 1}`;
            grid.appendChild(hourCell);

            const stateCell = document.createElement("div");
            stateCell.className = `box status ${power}`;
            stateCell.style.gridColumn = i;
            stateCell.style.gridRow = 2;
            grid.appendChild(stateCell);
        }

        switch (status) {
            case "ScheduleApplies":
                const kyivDt = new Date(new Date().toLocaleString('sv', {timeZone: "Europe/Kyiv"}));
                const currMin = kyivDt.getHours() * 60 + kyivDt.getMinutes();
                const events = slots.map(s => ({time: s.start, power: s.type == "NotPlanned"}))
                    .concat({time: 1440, power: slots.at(-1) != "NotPlanned"});

                const currPowerStatus = events.findLast(e => currMin > e.time).power;
                const nextTransitionIn = events.find(e => e.time > currMin).time - currMin;

                setTheme(currPowerStatus == false);
                document.getElementById("nextTransition").innerHTML = currPowerStatus
                    ? tr.on.nextTransition(nextTransitionIn)
                    : tr.off.nextTransition(nextTransitionIn);
                
                events.sort((a, b) => b.time - a.time);
                let last = events.pop();
                for (let h = 1; h <= 24; h++) {
                    const t = h * 60;
                    const nextTime = events.at(-1).time;
                    if (t < nextTime)
                        addHour(h, last.power? "on" : "off");
                    else if (t == nextTime) {
                        addHour(h, last.power? "on": "off");
                        last = events.pop();
                    } else {
                        addHour(h, last.power? "left-on" : "right-on");
                        last = events.pop();
                    }
                }
                break;
            
            case "EmergencyShutdowns":
                setTheme(true);
                document.getElementById("nextTransition").innerHTML = tr.emergency;
                break;
            
            default:
                document.getElementById("nextTransition").innerHTML = tr.unavailable;
                break;
        }
    </script>
</body>
</html>

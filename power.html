<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mikel power status?</title>

    <style>
        :root {
            --bg: #ffe;
            --text: #222;
            --box: #eee;

            --power-on: #ff0;
            --power-off: #000;
        }
        body.dark {
            --bg: #222;
            --text: #ccc;
            --box: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            text-align: center;
        }

        #subtitle {
            font-size: 1.4rem;
            font-weight: bold;
        }
        #title {
            font-size: 5rem;
            font-style: italic;
        }
        #nextTransition {
            font-size: 1.6rem;
        }
        #schedule {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 2px;
            max-width: 1400px;
            margin: 1rem auto;
        }
        .box {
            position: relative;
            aspect-ratio: 1/1;
            align-content: center;
            background: var(--box);
            border-radius: 4px;
        }
        .status {
            background: #888;
            border: 1px solid #ccc;
        }

        .box.off {
            background: var(--power-off);
        }
        .box.right-on {
            background: linear-gradient(to bottom right, var(--power-off) 50%, var(--power-on) 50%);
        }
        .box.on {
            background: var(--power-on);
        }
        .box.left-on {
            background: linear-gradient(to bottom right, var(--power-on) 50%, var(--power-off) 50%);
        }

        @media (max-width: 700px) {
            #schedule {
                grid-template-columns: 3rem 3rem;
                width: min-content;
            }
            .box {
                grid-column: auto !important;
                grid-row: auto !important;
            }
        }
    </style>
</head>
<body>
    <div id="subtitle">Hol' up</div>
    <div id="title">IDK</div>
    <div id="nextTransition">Fetching data…</div>
    <div id="schedule"></div>
    <div id="updatedDt">Please wait a bit</div>

    <script type="module">
        const {region, dsos, queue} = await fetch("https://api.github.com/gists/4ec4f7b97179cf442396387c4bf2eab4")
            .then(r => r.json())
            .then(c => JSON.parse(c["files"]["power.json"]["content"]));
        const data = await fetch(`https://corsproxy.io/?https://app.yasno.ua/api/blackout-service/public/shutdowns/regions/${region}/dsos/${dsos}/planned-outages`)
            .then(r => r.json());
        const {today: {slots, status}, updatedOn} = data[queue];

        document.getElementById("updatedDt").innerHTML = `Last update: ${new Date(updatedOn).toLocaleString()}`;

        function setTheme(isDark) {
            const choose = (array) => array[Math.floor(Math.random() * array.length)];

            document.body.classList.toggle("dark", isDark);
            const subtitle = document.getElementById("subtitle");
            const title = document.getElementById("title");

            if (isDark) {
                subtitle.innerHTML = choose(["Oh no", "Ah crap", "Damn it", "Welp", "Hecc", "Whyyy"]);
                title.innerHTML = choose(["No svitlo :(", "Power be gone", "Lights off!", "Darkness falls…", "I can't see", "Absolute blackness"]);
            } else {
                subtitle.innerHTML = choose(["Yay", "Cool", "Awesome", "Hooray", "Ooh nice", "Yippee"]);
                title.innerHTML = choose(["Let there be light!", "Potuzhno", "Bright AF", "Yes power :D", "Lights on!", "Dawn breaks…"]);
            }
        }
        
        function addHour(i, power) {
            const grid = document.getElementById("schedule");

            const hourCell = document.createElement("div");
            hourCell.className = "box";
            hourCell.style.gridColumn = i;
            hourCell.style.gridRow = 1;
            hourCell.innerHTML = `${i}`;
            grid.appendChild(hourCell);

            const stateCell = document.createElement("div");
            stateCell.className = `box status ${power}`;
            stateCell.style.gridColumn = i;
            stateCell.style.gridRow = 2;
            stateCell.innerHTML = `<div></div>`;
            grid.appendChild(stateCell);
        }

        switch (status) {
            case "ScheduleApplies":
                const kyivDt = new Date(new Date().toLocaleString('sv', {timeZone: "Europe/Kyiv"}));
                const currMin = kyivDt.getHours() * 60 + kyivDt.getMinutes();
                const events = slots.map(s => ({time: s.start, power: s.type == "NotPlanned"}))
                    .concat({time: 1440, power: slots.at(-1) != "NotPlanned"});

                const currPowerStatus = events.findLast(e => currMin > e.time).power;
                const nextTransitionIn = events.find(e => e.time > currMin).time - currMin;
                const nTHours = Math.floor(nextTransitionIn / 60);
                const nTMinutes = nextTransitionIn % 60;

                setTheme(currPowerStatus == false);
                document.getElementById("nextTransition").innerHTML = currPowerStatus
                    ? `Next outage in ${nTHours} hour(s) ${nTMinutes} minute(s).`
                    : `Power returns in ${nTHours} hour(s) ${nTMinutes} minute(s).`;
                
                events.sort((a, b) => b.time - a.time);
                let last = events.pop();
                for (let h = 1; h <= 24; h++) {
                    const t = h * 60;
                    const nextTime = events.at(-1).time;
                    if (t < nextTime)
                        addHour(h, last.power? "on" : "off");
                    else if (t == nextTime) {
                        addHour(h, last.power? "on": "off");
                        last = events.pop();
                    } else {
                        addHour(h, last.power? "left-on" : "right-on");
                        last = events.pop();
                    }
                }
                break;
            
            case "EmergencyShutdowns":
                setTheme(true);
                document.getElementById("nextTransition").innerHTML = "Emergency shutdowns D:\nNobody knows when power returns."
                break;
            
            default:
                document.getElementById("nextTransition").innerHTML = "No schedule available yet."
                break;
        }
    </script>
</body>
</html>
